name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traxac_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/traxac_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/traxac_test
      TRAXAC_MASTER_KEY: dGVzdC1rZXktMzItYnl0ZXMtZm9yLWNpLXVzZS1vbmx5MDA=
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — packageManager in package.json is the
      # single source of truth. Specifying both makes the action fail with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:migrate
      # Integration tests run against the service Postgres: tenant isolation
      # and number allocation are enforced by SQL, so a mock proves nothing.
      - run: pnpm test
      # The production bundle must exist for the routing test to be meaningful
      # and for the API to have something to serve.
      - run: pnpm build
