# Railway build configuration, shared by both services.
#
# One repository, two services:
#   app     — railway.json         : builds the web app + packages, runs the API
#             which serves the SPA and /api on a single origin
#   worker  — railway.worker.json  : builds packages only, runs the job runner
#
# The worker service points at railway.worker.json via its
# "Config as code" path setting in the Railway dashboard.

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-9_x"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[variables]
NODE_ENV = "production"
# pnpm's symlinked store confuses some resolvers; hoisting keeps it flat.
NPM_CONFIG_NODE_LINKER = "hoisted"
